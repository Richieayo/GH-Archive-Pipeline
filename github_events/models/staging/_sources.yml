version: 2

sources:
    - name: github_events
      database: github_events
      schema: raw
      config:
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 3, period: hour}
          error_after: {count: 6, period: hour}
      tables:
        - name: raw_events
          description: "Auto Loader output - one row per line of each landed .json.gz file, JSON untouched. Ingestion output, not dbt-managed"
